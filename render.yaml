services:
  - type: web
    name: luna-memory-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: LLM_PROVIDER
        value: openrouter
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: ALLOWED_ORIGINS
        value: https://luna-memory-web.onrender.com
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: LOG_INCLUDE_CONTENT
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: IP_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: MESSAGE_MAX_CHARS
        value: "4000"
      - key: MEMORY_DB_PATH
        value: data/memories.db
      - key: LOG_PATH
        value: logs/character-memory.jsonl

  - type: web
    name: luna-memory-web
    runtime: static
    buildCommand: echo "Static files ready"
    staticPublishPath: ./dist
