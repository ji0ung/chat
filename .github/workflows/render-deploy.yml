name: Deploy to Render
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      - name: Explain missing secret
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo 'RENDER_DEPLOY_HOOK_URL secret is not configured; Render GitHub auto-deploy remains active.'
